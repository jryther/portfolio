# Checks every pull request into main, then merges low-risk Dependabot updates once they pass.
#
# Runs on pull requests only, never on pushes to main: each change is checked once, here, and
# Cloudflare Pages deploys main when it moves. Set Cloudflare's build command to `npx vite build`
# so the deploy doesn't repeat the lint and unit tests (`npm run build` runs them first).
#
# GitHub Free doesn't offer branch protection on private repos, so the merge is a job that only
# runs after every check has passed. That gives the same guarantee as a required status check.
#
# Actions are pinned to a commit SHA (a tag can be moved to different code; a commit can't).
# Dependabot keeps the pins and their version comments up to date.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run still in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default; only the merge job asks for more
permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # .npmrc applies here too: no install scripts, official registry only
      - name: Install dependencies
        run: npm ci

      - name: Verify package signatures
        run: npm audit signatures

      # Fails at moderate severity or above (audit-level in .npmrc)
      - name: Audit dependencies
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: |
          npx vue-tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.e2e.json

      - name: Unit tests
        run: npm run test:run

      # Built once; the e2e tests below run against this same build (vite preview)
      - name: Build
        run: npx vite build

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cached browser still needs its system libraries on a fresh runner
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  automerge:
    name: Auto-merge Dependabot patch/minor
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor only (for grouped PRs, update-type is the largest change in the group).
      # Majors and wllama stay open for review: a wllama update needs `npm run embed:topics`.
      - name: Merge
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, '@wllama/')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
