# Dependabot: weekly dependency updates as pull requests.
#
# Patch and minor updates arrive as grouped PRs (dev and production) that the CI workflow
# can merge once every check passes. Major versions, and wllama, each get their own PR for review,
# except Vitest and its plugins, which always update together in one PR.
#
# Node is pinned to an exact version in .node-version (CI and Cloudflare both read it). Some
# packages require a recent Node, and .npmrc's engine-strict refuses to install them on an
# older one, so bump .node-version (and local Node) when an update asks for it.
#
# Cooldown: a new release has to be out for a few days before Dependabot proposes it, so a
# compromised or broken release is usually caught and pulled before it reaches this repo.
# Security updates skip the cooldown and open right away.
#
# Not covered: the EmbeddingGemma model, pinned by URL in src/services/chatModel.ts.
#
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    # @types/node describes the Node API, so its major follows the Node version in
    # .node-version (24); move both together by hand. Minor and patch updates still come
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    assignees:
      - jryther
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Vitest and its plugins require the exact same version of each other, so they always
      # move together, majors included (a major still waits for review). Listed first: a
      # package goes to the first group it matches
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Build tools, linters, test runners
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # What ships to visitors (vue, vue-i18n)
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
        # wllama stays on its own PR: a new version can shift the embeddings, so the topic
        # vectors need `npm run embed:topics` before it merges
        exclude-patterns:
          - "@wllama/*"
    # Other major versions match no group, so each one opens its own PR

  # Keeps the actions used by the CI workflows up to date once they exist
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    assignees:
      - jryther
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
